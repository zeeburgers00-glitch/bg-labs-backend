services:
  - type: web
    name: bg-labs-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "postgresql://neondb_owner:npg_i8kuvDWocUt5@ep-dark-tree-ax4ktb4c-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require"
    healthCheckPath: /health
    autoDeploy: true
    cron: []
    preDeployCommand: ""

# Keep-alive cron: pings /keep-alive every 10 minutes via external service
# Configure this in Render dashboard or use a service like cron-job.org
# URL to ping: https://your-app.onrender.com/keep-alive
# Schedule: */10 * * * *
